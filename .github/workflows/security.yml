name: Sécurité

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # la CI ne pousse jamais : aucun jeton git conservé
      - name: Auto-test des contrôles
        run: bash tests/security/selftest.sh
      - name: Contrôles de sécurité
        run: bash tests/security/check.sh

  integration-maison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # la CI ne pousse jamais : aucun jeton git conservé
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Dépendances
        run: pip install voluptuous==0.15.2
      - name: Tests de l'intégration (code, sessions, validation, budget)
        run: python -m unittest discover -s tests/maison -v
