name: Sécurité

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Auto-test des contrôles
        run: bash tests/security/selftest.sh
      - name: Contrôles de sécurité
        run: bash tests/security/check.sh

  integration-maison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Dépendances
        run: pip install voluptuous==0.15.2
      - name: Tests de l'intégration (code, sessions, validation, budget)
        run: python -m unittest discover -s tests/maison -v
