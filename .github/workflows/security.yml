name: Sécurité

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Auto-test des contrôles
        run: bash tests/security/selftest.sh
      - name: Contrôles de sécurité
        run: bash tests/security/check.sh
